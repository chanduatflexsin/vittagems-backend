<p>Verification takes minutes, not milliseconds, and occasionally longer. Show your own users a
"settlement in progress" state rather than blocking them, and treat
<code>AWAITING_APPROVAL</code> as a normal, expected status rather than an error.</p></div>
`},

/* ───────────────────────────── REFERENCE ───────────────────────────── */

'api-reference': { group:'Reference', title:'API reference', eyebrow:'Reference', h1:'API reference',
  body:`
<p class="lede">Every endpoint available to you, with the scope and headers it needs. Base URL
<code>{{BASE}}</code>.</p>

<h2 id="headers">Headers</h2>
<div class="tablewrap"><table>
<thead><tr><th>Header</th><th>When</th></tr></thead>
<tbody>
<tr><td><code>Authorization: Bearer &lt;api key&gt;</code></td><td>Every request</td></tr>
<tr><td><code>Content-Type: application/json</code></td><td>Any request with a JSON body</td></tr>
<tr><td><code>Idempotency-Key: &lt;10+ chars&gt;</code></td><td><code>POST /mint</code>, <code>/transfers</code>, <code>/withdrawals</code></td></tr>
<tr><td><code>X-File-Name: &lt;filename&gt;</code></td><td>Document uploads (with the file's own <code>Content-Type</code>)</td></tr>
<tr><td><code>x-request-id: &lt;your id&gt;</code></td><td>Optional; echoed back as <code>request_id</code></td></tr>
</tbody></table></div>

<h2 id="account">Account</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><span class="m m-get">GET</span> <code>/client</code></td><td>—</td><td>Your account, addresses and scopes</td></tr>
<tr><td><span class="m m-get">GET</span> <code>/wallets</code></td><td>—</td><td>Your wallets and their whitelist status</td></tr>
<tr><td><span class="m m-post">POST</span> <code>/wallets</code></td><td>—</td><td><code>address</code>, <code>label</code>. Submits for review.</td></tr>
</tbody></table></div>

<h2 id="deposits">Deposits</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Body</th></tr></thead>
<tbody>
<tr><td><span class="m m-post">POST</span> <code>/deposits</code></td><td>—</td><td><code>amount</code>, <code>currency</code>, <code>referenceId</code>, <code>proof.bankReference</code> (+ <code>payerName</code>, <code>notes</code>)</td></tr>
<tr><td><span class="m m-post">POST</span> <code>/deposits/{id}/documents</code></td><td>—</td><td>Raw file bytes</td></tr>
</tbody></table></div>

<h2 id="mint">Mint</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Body</th></tr></thead>
<tbody>
<tr><td><span class="m m-post">POST</span> <code>/mint</code></td><td><code>MINT</code></td><td><code>referenceId</code>, <code>toAddress</code>, <code>amount</code>, <code>corridor</code>?</td></tr>
<tr><td><span class="m m-get">GET</span> <code>/mint/{id}</code></td><td><code>TRANSACTION_READ</code></td><td>—</td></tr>
</tbody></table></div>

<h2 id="transfers">Transfers</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Body</th></tr></thead>
<tbody>
<tr><td><span class="m m-post">POST</span> <code>/transfers</code></td><td><code>TRANSFER</code></td><td><code>referenceId</code>, <code>fromAddress</code>, <code>toAddress</code>, <code>amount</code></td></tr>
<tr><td><span class="m m-get">GET</span> <code>/transfers/{id}</code></td><td><code>TRANSACTION_READ</code></td><td>—</td></tr>
</tbody></table></div>

<h2 id="withdrawals">Withdrawals</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Body</th></tr></thead>
<tbody>
<tr><td><span class="m m-post">POST</span> <code>/withdrawals</code></td><td><code>WITHDRAW</code></td><td><code>referenceId</code>, <code>fromAddress</code>, <code>amount</code>, <code>bankDetails</code>, <code>windowMinutes</code>?</td></tr>
<tr><td><span class="m m-get">GET</span> <code>/withdrawals/{id}</code></td><td><code>WITHDRAW_STATUS</code></td><td>—</td></tr>
<tr><td><span class="m m-post">POST</span> <code>/withdrawals/{id}/payout-proof</code></td><td><code>WITHDRAW</code></td><td><code>payoutReference</code>, <code>notes</code>?</td></tr>
<tr><td><span class="m m-post">POST</span> <code>/withdrawals/{id}/extend</code></td><td><code>WITHDRAW</code></td><td><code>reason</code></td></tr>
<tr><td><span class="m m-post">POST</span> <code>/withdrawals/{id}/documents</code></td><td>—</td><td>Raw file bytes</td></tr>
</tbody></table></div>

<h2 id="documents">Documents</h2>
<div class="tablewrap"><table>
<thead><tr><th>Endpoint</th><th>Scope</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><span class="m m-get">GET</span> <code>/documents/{id}</code></td><td>—</td><td>Your own uploads only</td></tr>
</tbody></table></div>

<div class="note"><span class="h">Not listed here</span>
<p>The reviewer-facing endpoints are documented separately and are not available to client API keys.
If a call returns <code>401</code> and it is not in this table, that is why.</p></div>
`},

'glossary': { group:'Reference', title:'Statuses &amp; glossary', eyebrow:'Reference', h1:'Statuses &amp; glossary',
  body:`
<p class="lede">Every status this API will hand you, in one place.</p>

<h2 id="deposit">Deposit</h2>
<div class="tablewrap"><table>
<thead><tr><th>Status</th><th>Meaning</th><th>Terminal</th></tr></thead>
<tbody>
<tr><td><span class="pill warn">PENDING_VERIFICATION</span></td><td>Recorded, awaiting review</td><td>No</td></tr>
<tr><td><span class="pill ok">VERIFIED</span></td><td>Confirmed. Any held mint is released.</td><td>Yes</td></tr>
<tr><td><span class="pill bad">REJECTED</span></td><td>Not confirmed. Nothing mints, ever.</td><td>Yes</td></tr>
</tbody></table></div>

<h2 id="transaction">Transaction (mint, transfer)</h2>
<div class="tablewrap"><table>
<thead><tr><th>Status</th><th>Meaning</th><th>Terminal</th></tr></thead>
<tbody>
<tr><td><span class="pill warn">AWAITING_APPROVAL</span></td><td>Held pending verification</td><td>No</td></tr>
<tr><td><span class="pill">PENDING</span></td><td>Queued</td><td>No</td></tr>
<tr><td><span class="pill acc">SUBMITTED</span></td><td>Sent to the network</td><td>No</td></tr>
<tr><td><span class="pill ok">CONFIRMED</span></td><td>Settled, with a <code>blockchainTxHash</code></td><td>Yes</td></tr>
<tr><td><span class="pill bad">FAILED</span></td><td>Did not settle; see <code>errorMessage</code></td><td>Yes</td></tr>
</tbody></table></div>

<h2 id="withdrawal">Withdrawal</h2>
<div class="tablewrap"><table>
<thead><tr><th>Status</th><th>Meaning</th><th>Terminal</th></tr></thead>
<tbody>
<tr><td><span class="pill">REQUESTED</span></td><td>Created</td><td>No</td></tr>
<tr><td><span class="pill acc">LOCK_PENDING</span></td><td>Lock being applied</td><td>No</td></tr>
<tr><td><span class="pill acc">LOCKED</span></td><td>Locked — pay your customer now</td><td>No</td></tr>
<tr><td><span class="pill warn">PAYOUT_SUBMITTED</span></td><td>Payout reported, under review</td><td>No</td></tr>
<tr><td><span class="pill acc">BURN_PENDING</span></td><td>Verified; closing</td><td>No</td></tr>
<tr><td><span class="pill ok">SETTLED</span></td><td>Closed</td><td>Yes</td></tr>
<tr><td><span class="pill acc">RELEASE_PENDING</span></td><td>Being unlocked</td><td>No</td></tr>
<tr><td><span class="pill warn">RELEASED</span></td><td>Funds returned to you</td><td>Yes</td></tr>
<tr><td><span class="pill bad">FAILED</span></td><td>Lock or close did not complete</td><td>Yes</td></tr>
</tbody></table></div>

<h2 id="wallet">Wallet</h2>
<div class="tablewrap"><table>
<thead><tr><th>Status</th><th>Meaning</th></tr></thead>
<tbody>
<tr><td><span class="pill warn">PENDING</span></td><td>Under review — cannot hold value</td></tr>
<tr><td><span class="pill ok">ACTIVE</span></td><td>Approved</td></tr>
<tr><td><span class="pill bad">REJECTED</span></td><td>Refused, with a reason</td></tr>
<tr><td><span class="pill bad">REVOKED</span></td><td>Approval withdrawn, with a reason</td></tr>
</tbody></table></div>

<h2 id="terms">Terms</h2>
<dl class="kv">
  <dt>settlement</dt><dd>One unit of value on the rail, identified by your <code>referenceId</code>. Moves whole; never split.</dd>
  <dt>referenceId</dt><dd>Your identifier for a settlement, chosen when you record the deposit. Unique forever.</dd>
  <dt>deposit</dt><dd>Your record that fiat arrived. Verified before anything is minted against it.</dd>
  <dt>mint</dt><dd>Creating settlement value against a verified deposit.</dd>
  <dt>transfer</dt><dd>Moving a whole settlement to another business on the rail.</dd>
  <dt>withdrawal</dt><dd>Redeeming a settlement back to fiat. Locks it while you pay out.</dd>
  <dt>bank reference</dt><dd>The reference your bank assigned to a transfer — UTR, wire reference or ACH trace number. What reviewers match on.</dd>
  <dt>payout reference</dt><dd>The same thing for money you sent out.</dd>
  <dt>corridor</dt><dd>Optional reporting label on a mint, e.g. <code>US-US</code>.</dd>
  <dt>blockchainTxHash</dt><dd>The settlement's permanent on-chain receipt. Store it.</dd>
  <dt>window</dt><dd>The time a request has to be verified before it expires.</dd>
</dl>
`},

'go-live': { group:'Reference', title:'Before you go live', eyebrow:'Reference', h1:'Before you go live',
  body:`
<p class="lede">Work through this in sandbox. Every item is something that has gone wrong in a real
integration.</p>

<h2 id="credentials">Credentials</h2>
<ul>
  <li>Production key is in a secrets manager, <strong>not</strong> in your repository or your image</li>
  <li>The key is never sent to a browser or mobile client — all calls originate server-side</li>
  <li>Sandbox and production keys come from separate configuration, so neither can be used by accident</li>
  <li>You know who to contact for rotation, and rotating does not require a code change</li>
</ul>

<h2 id="wallet">Wallet</h2>
<ul>
  <li>Your production wallet reads <code>ACTIVE</code> at <code>GET /wallets</code></li>
  <li>You handle <code>WALLET_NOT_WHITELISTED</code> as an alert to a human, not a retry</li>
  <li>The private key for that address is stored somewhere you control, and somewhere you can still
  reach if the person who generated it leaves</li>
</ul>

<h2 id="correctness">Correctness</h2>
<ul>
  <li>Idempotency keys are derived from your own records — <strong>confirm a retry does not
  double-settle</strong> by actually sending one twice in sandbox</li>
  <li>References are unique, and you have decided what happens when a customer pays the same invoice
  twice</li>
  <li>Amounts are sent as strings, and your serialiser is not silently turning them into numbers</li>
  <li>You never mark an invoice paid on a <code>202</code> — only on <code>CONFIRMED</code></li>
  <li>You have exercised a rejection, not just the happy path</li>
</ul>

<h2 id="async">Asynchronous handling</h2>
<ul>
  <li>Polling runs in a background worker, never inside a customer-facing request</li>
  <li>Poll intervals match the clock: ~30s while <code>AWAITING_APPROVAL</code>, ~3s once
  <code>SUBMITTED</code></li>
  <li>A reconciliation job re-reads anything left non-terminal, so a crashed poll self-heals</li>
  <li>Your status handler is idempotent — you will see the same state more than once</li>
</ul>

<h2 id="withdrawals">Withdrawals, specifically</h2>
<ul>
  <li>You pay your customer <strong>after</strong> the withdrawal reports <code>LOCKED</code>, never
  before</li>
  <li>You submit the payout reference promptly — verification cannot start until you do</li>
  <li><code>RELEASED</code> raises an operational alert, because it means a payout may have gone out
  against a settlement that is now unredeemed</li>
  <li>Your window sizes match your bank's actual cut-offs, and you extend rather than let one expire</li>
</ul>

<h2 id="evidence">Evidence</h2>
<ul>
  <li>Every deposit carries a real bank reference, not a description</li>
  <li>Documents are attached automatically, not when someone remembers</li>
  <li>The reference, payer and amount are legible in whatever you attach</li>
  <li>PDF or PNG where possible — those are previewed rather than downloaded</li>
</ul>

<h2 id="observability">Observability</h2>
<ul>
  <li>You log <code>referenceId</code>, <code>transactionId</code> and <code>request_id</code> for
  every call</li>
  <li><code>blockchainTxHash</code> is stored against your invoice</li>
  <li>You alert on <code>FAILED</code>, on <code>RELEASED</code>, and on anything stuck non-terminal
  for longer than your expected window</li>
  <li>API keys are redacted from your logs — check this rather than assume it</li>
</ul>

<h2 id="switch">Switching over</h2>
<p>Two values change: the base URL and the API key.</p>

<div class="code" data-lang="bash"><pre><code># sandbox
VG_API_BASE="{{SANDBOX}}"
VG_API_KEY="vg_test_..."

# production
VG_API_BASE="{{PROD}}"
VG_API_KEY="vg_live_..."</code></pre></div>

<p>Settle one small, real payment end to end before you point any volume at it — including the
withdrawal, so you have seen a full round trip in production rather than only in sandbox.</p>
`},
};

/* ════════════════════════════════════════════════════════════════════
   Shell: nav, routing, TOC, tabs, copy, highlighting, theme, env
   ════════════════════════════════════════════════════════════════════ */

const KEYS = Object.keys(PAGES);
const GROUPS = [];
KEYS.forEach((k) => {
  const g = PAGES[k].group;
  let row = GROUPS.find((x) => x.name === g);
  if (!row) GROUPS.push((row = { name: g, items: [] }));
  row.items.push(k);
});

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let envName = ENVS[store.get('vg-env')] ? store.get('vg-env') : 'sandbox';
const baseUrl = () => ENVS[envName];

/** Swap the URL placeholders for whichever environment is selected. */
const expand = (html) => html
  .split('{{BASE}}').join(ENVS[envName])
  .split('{{SANDBOX}}').join(ENVS.sandbox)
  .split('{{PROD}}').join(ENVS.production);

/* ── sidebar ─────────────────────────────────────────────────────── */
function buildNav() {
  $('#navlist').innerHTML = GROUPS.map((g) => `
    <div class="navgroup" data-group="${g.name}">
      <h4>${g.name}</h4>
      ${g.items.map((k) => `<a href="#/${k}" data-key="${k}">${PAGES[k].title}</a>`).join('')}
    </div>`).join('');
}

function filterNav(q) {
  const needle = q.trim().toLowerCase();
  let shown = 0;
  $$('.navgroup').forEach((grp) => {
    let any = 0;
    $$('a', grp).forEach((a) => {
      const hit = !needle || a.dataset.key.includes(needle) || a.textContent.toLowerCase().includes(needle);
      a.hidden = !hit;
      if (hit) { any++; shown++; }
    });
    grp.hidden = !any;
  });
  $('#navempty').hidden = shown > 0;
}

/* ── routing ─────────────────────────────────────────────────────── */
function currentKey() {
  const k = (location.hash || '').replace(/^#\/?/, '');
  return PAGES[k] ? k : 'introduction';
}

function render() {
  const key = currentKey();
  const page = PAGES[key];
  const idx = KEYS.indexOf(key);
  const prev = KEYS[idx - 1];
  const next = KEYS[idx + 1];

  $('#main').innerHTML = `
    <article class="page">
      <p class="eyebrow">${page.eyebrow}</p>
      <h1>${page.h1}</h1>
      ${expand(page.body)}
      <nav class="pagenav">
        ${prev ? `<a href="#/${prev}"><span>Previous</span><b>${PAGES[prev].title}</b></a>` : '<span></span>'}
        ${next ? `<a class="nx" href="#/${next}"><span>Next</span><b>${PAGES[next].title}</b></a>` : '<span></span>'}
      </nav>
    </article>`;

  $$('#navlist a').forEach((a) => a.classList.toggle('on', a.dataset.key === key));
  document.title = `${page.title} · VittaGems Settlement Docs`;

  decorateCode();
  buildTabs();
  buildToc();
  if (window.matchMedia('(max-width:860px)').matches) closeNav();
}

/* ── on this page ────────────────────────────────────────────────── */
let tocObserver = null;
function buildToc() {
  const heads = $$('#main h2[id]');
  const toc = $('#toc');
  if (!heads.length) { toc.innerHTML = ''; return; }
  toc.innerHTML = `<h5>On this page</h5>` +
    heads.map((h) => `<a href="#${h.id}" data-h="${h.id}">${h.textContent}</a>`).join('');

  toc.onclick = (e) => {
    const a = e.target.closest('a[data-h]');
    if (!a) return;
    e.preventDefault();
    document.getElementById(a.dataset.h)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  tocObserver?.disconnect();
  tocObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      $$('#toc a').forEach((a) => a.classList.toggle('on', a.dataset.h === en.target.id));
    });
  }, { rootMargin: '-70px 0px -72% 0px' });
  heads.forEach((h) => tocObserver.observe(h));
}

/* ── tabs ────────────────────────────────────────────────────────── */
function buildTabs() {
  $$('#main .tabs[data-tabs]').forEach((bar) => {
    const name = bar.dataset.tabs;
    const remembered = store.get(`vg-tab-${name}`);
    const pick = (tab) => {
      $$('button', bar).forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
      $$(`[data-panel^="${name}-"]`, $('#main')).forEach((p) => {
        p.hidden = p.dataset.panel !== `${name}-${tab}`;
      });
      store.set(`vg-tab-${name}`, tab);
    };
    if (remembered && $(`button[data-tab="${remembered}"]`, bar)) pick(remembered);
    bar.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]');
      if (b) pick(b.dataset.tab);
    });
  });
}

/* ── code blocks: highlight + copy ───────────────────────────────── */
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// One regex pass per language, so a replacement can never land inside an earlier one.
const RULES = {
  bash: [/(#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:[^'\\]|\\.)*')|(\s--?[A-Za-z][\w-]*)|\b(curl|npm|npx|node|cd|cp|export|git)\b/g,
         ['tk-com', 'tk-str', 'tk-kw', 'tk-kw']],
  json: [/("(?:\\.|[^"\\])*")(\s*:)|(\/\/[^\n]*)|("(?:\\.|[^"\\])*")|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g,
         ['tk-key', null, 'tk-com', 'tk-str', 'tk-kw', 'tk-num']],
  js:   [/(\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|\b(const|let|async|await|function|return|if|for|throw|new|export|import|from|of)\b|\b(\d+(?:_\d+)*)\b/g,
         ['tk-com', 'tk-str', 'tk-kw', 'tk-num']],
  python: [/(#[^\n]*)|(f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*')|\b(def|class|import|from|with|as|return|raise|if|not|or|and|None|True|False)\b|\b(\d+)\b/g,
         ['tk-com', 'tk-str', 'tk-kw', 'tk-num']],
};

function highlight(text, lang) {
  const rule = RULES[lang];
  if (!rule) return esc(text);
  const [re, classes] = rule;
  let out = '', last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(text)) !== null) {
    if (m[0] === '') { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index));
    const gi = m.slice(1).findIndex((x) => x !== undefined);
    const cls = classes[gi];
    out += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function decorateCode() {
  $$('#main .code').forEach((box) => {
    const lang = box.dataset.lang || '';
    const code = $('code', box) || $('pre', box);
    const raw = code.textContent;
    code.innerHTML = highlight(raw, lang);

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.innerHTML = `<span class="lang">${lang || 'text'}</span><span class="spacer"></span>
      <button class="copy" type="button">Copy</button>`;
    box.insertBefore(bar, box.firstChild);

    $('.copy', bar).addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(raw);
        btn.textContent = 'Copied';
        btn.classList.add('done');
      } catch {
        btn.textContent = 'Press Ctrl+C';
      }
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
    });
  });
}

/* ── mobile nav ──────────────────────────────────────────────────── */
const isNarrow = () => window.matchMedia('(max-width:860px)').matches;
function closeNav() { $('#sidebar').hidden = true; $('#menubtn').setAttribute('aria-expanded', 'false'); }
function openNav() { $('#sidebar').hidden = false; $('#menubtn').setAttribute('aria-expanded', 'true'); }

$('#menubtn').addEventListener('click', () => ($('#sidebar').hidden ? openNav() : closeNav()));
window.addEventListener('resize', () => { if (!isNarrow()) $('#sidebar').hidden = false; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && isNarrow()) closeNav();
  if (e.key === '/' && document.activeElement !== $('#navsearch')) {
    e.preventDefault();
    if (isNarrow()) openNav();
    $('#navsearch').focus();
  }
});

/* ── environment switch ──────────────────────────────────────────── */
$('#envsel').value = envName;
$('#envsel').addEventListener('change', (e) => {
  envName = ENVS[e.target.value] ? e.target.value : 'sandbox';
  store.set('vg-env', envName);
  render();                       // rewrites every base URL in the samples
});

/* ── theme ───────────────────────────────────────────────────────── */
const savedTheme = store.get('vg-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
$('#themebtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('vg-theme', next);
});

/* ── boot ────────────────────────────────────────────────────────── */
buildNav();
$('#navsearch').addEventListener('input', (e) => filterNav(e.target.value));
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
if (isNarrow()) closeNav();
render();
</script>
